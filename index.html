.profile-identity-block{

    radial-gradient(120px 100px at 82% 8%,rgba(255,255,255,.22),transparent 66%),
    linear-gradient(135deg,color-mix(in srgb,var(--accent-ink),#7b5262 34%),color-mix(in srgb,var(--accent),#8e6572 20%) 58%,color-mix(in srgb,var(--accent),#181717 12%));

  box-shadow:

}
.profile-identity-block:after{
  content:"";
  position:absolute;
  right:-28px;
  bottom:-42px;
  width:150px;
  height:150px;
  border-radius:42% 58% 48% 52%;
  background:rgba(255,255,255,.10);
  transform:rotate(-18deg);
}
.profile-kicker{
  position:relative;
  z-index:1;
  color:rgba(255,255,255,.70);
  font-size:10px;
  font-weight:820;

  margin-bottom:13px;
}
.profile-main{
  position:relative;
  z-index:1;
  display:grid;
  grid-template-columns:62px 1fr;
  gap:13px;
  align-items:center;
}
.profile-avatar{
  width:62px;
  height:62px;

}

  font-size:11.5px;
  line-height:1.45;
}
.profile-stats{
  position:relative;
  z-index:1;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:18px;
}
.profile-stats div{
  min-height:45px;
  border-radius:15px;
  padding:8px;
  background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.16);
  box-shadow:0 1px 0 rgba(255,255,255,.14) inset;
}
.profile-stats b{
  display:block;
  font-size:13px;
  font-weight:820;
}
.profile-stats small{
  display:block;
  margin-top:5px;
  color:rgba(255,255,255,.62);
  font-size:9.5px;
}
.profile-status-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:16px;
}
.status-block{
  position:relative;
  overflow:hidden;
  min-height:92px;
  border:1px solid var(--hairline);
  border-radius:22px;
  padding:13px;
  text-align:left;
  background:
    radial-gradient(70px 60px at 96% 18%,color-mix(in srgb,var(--block-accent),transparent 74%),transparent 70%),
    linear-gradient(180deg,rgba(255,255,255,.93),rgba(255,255,255,.70)),
    var(--block-bg);
  box-shadow:
    0 1px 0 rgba(255,255,255,.86) inset,
    0 16px 34px rgba(20,24,23,.075);
}
.status-block.wide{grid-column:span 2;min-height:84px}
.status-block b{
  position:relative;
  z-index:1;
  display:block;
  font-size:14px;
  font-weight:820;
}
.status-block span{
  position:relative;
  z-index:1;
  display:block;
  margin-top:8px;
  color:var(--muted);
  font-size:12px;
}
.status-block small{
  position:absolute;
  right:13px;
  bottom:12px;
  color:color-mix(in srgb,var(--block-accent),black 18%);
  font-size:18px;
  font-weight:840;
  opacity:.30;
}
.profile-theme-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.profile-theme-card{
  position:relative;
  min-height:54px;
  overflow:hidden;
  border:1px solid var(--hairline);
  border-radius:17px;
  padding:8px 26px 8px 48px;
  text-align:left;
  display:flex;
  flex-direction:column;
  justify-content:center;
  background:
    linear-gradient(90deg,color-mix(in srgb,var(--tone-a),white 20%) 0 38px,transparent 38px),
    linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,255,255,.72));
  box-shadow:
    0 1px 0 rgba(255,255,255,.88) inset,
    0 10px 24px rgba(20,24,23,.055);
}
.profile-theme-card.on{
  border-color:color-mix(in srgb,var(--tone-c),transparent 44%);
  box-shadow:
    0 0 0 2px color-mix(in srgb,var(--tone-c),transparent 86%),
    0 12px 28px color-mix(in srgb,var(--tone-c),transparent 84%);
}
.tone-preview{
  position:absolute;
  left:10px;
  top:50%;
  width:28px;
  height:28px;
  transform:translateY(-50%);
  border-radius:11px;
  overflow:hidden;
  margin-bottom:0;
  background:
    radial-gradient(18px 14px at 86% 18%,color-mix(in srgb,var(--tone-c),white 30%),transparent 72%),
    linear-gradient(135deg,var(--tone-a),var(--tone-b) 52%,color-mix(in srgb,var(--tone-c),var(--tone-b) 45%));
  border:1px solid rgba(20,24,23,.06);
}
.tone-preview:after{
  content:"";
  position:absolute;
  left:7px;
  right:8px;
  bottom:8px;
  height:2px;
  border-radius:999px;
  background:rgba(255,255,255,.55);
  box-shadow:0 -6px 0 -1px rgba(255,255,255,.30);
}
.profile-theme-card b{
  display:block;
  font-size:12.5px;
  font-weight:830;
}
.profile-theme-card small{
  display:block;
  margin-top:2px;
  color:var(--muted);
  font-size:9.5px;
  line-height:1.35;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.profile-theme-card .check-mark{
  position:absolute;
  right:9px;
  top:50%;
  width:9px;
  height:9px;
  transform:translateY(-50%);
  border-radius:50%;
  border:1px solid color-mix(in srgb,var(--tone-c),transparent 58%);
  background:rgba(255,255,255,.54);
}
.profile-theme-card.on .check-mark{
  background:var(--tone-c);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--tone-c),transparent 84%);
}
@keyframes pageEnter{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}@keyframes messageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes scrimIn{from{opacity:0}to{opacity:1}}@keyframes drawerIn{from{transform:translateX(108%)}to{transform:translateX(0)}}@keyframes sheetUp{from{transform:translateY(104%)}to{transform:translateY(0)}}@keyframes notePop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}

/* Investor demo polish pass */
:root{
  --bg: #f7f8f6;
  --surface: rgba(255,255,255,.86);
  --surface-2: #eff2f0;
  --fg: #151716;
  --muted: #68706d;
  --subtle: #98a09c;
  --border: rgba(21,23,22,.095);
  --hairline: rgba(21,23,22,.075);
  --accent: #3b6f78;
  --accent-ink: #173b42;
  --accent-soft: #e7f0ee;
  --success: #4d8870;
  --danger: #b45a51;
  --tab: rgba(18,20,19,.94);
  --shadow: 0 26px 72px rgba(20,24,23,.18);
  --shadow-soft: 0 10px 28px rgba(20,24,23,.06);
  --radius: 18px;
  --ease: cubic-bezier(.2,.9,.2,1);
}
:root[data-theme="warm"]{
  --bg:#f8f6f1;--surface:rgba(255,255,255,.86);--surface-2:#f1ece4;
  --fg:#181614;--muted:#706a62;--subtle:#a0998e;--border:rgba(40,31,20,.095);--hairline:rgba(40,31,20,.075);
  --accent:#8a6b3f;--accent-ink:#4c351a;--accent-soft:#f0eadf;--tab:rgba(26,22,17,.94);
}
:root[data-theme="mint"]{
  --bg:#f5f8f5;--surface:rgba(255,255,255,.86);--surface-2:#edf3ef;
  --fg:#141817;--muted:#62706a;--subtle:#96a29d;--border:rgba(20,42,34,.095);--hairline:rgba(20,42,34,.075);
  --accent:#4c7963;--accent-ink:#1c3f31;--accent-soft:#e6f0ea;--tab:rgba(16,23,20,.94);
}
:root[data-theme="rose"]{
  --bg:#f9f6f6;--surface:rgba(255,255,255,.86);--surface-2:#f2ebed;
  --fg:#181516;--muted:#71666a;--subtle:#a3969b;--border:rgba(49,22,32,.095);--hairline:rgba(49,22,32,.075);
  --accent:#9a6871;--accent-ink:#512d35;--accent-soft:#f1e7ea;--tab:rgba(24,18,20,.94);
}
:root[data-theme="dark"]{
  --bg:#111513;--surface:rgba(31,35,33,.86);--surface-2:#252b28;
  --fg:#f5f4f1;--muted:#aeb7b2;--subtle:#7e8782;--border:rgba(255,255,255,.105);--hairline:rgba(255,255,255,.08);
  --accent:#9fc4bc;--accent-ink:#dcefeb;--accent-soft:#263d39;--success:#8ac2a7;--danger:#d1847c;--tab:rgba(8,10,9,.95);
  --shadow:0 26px 72px rgba(0,0,0,.45);--shadow-soft:0 12px 30px rgba(0,0,0,.22);
}
*{letter-spacing:0!important}
body{
  background:
    linear-gradient(180deg,#fbfbf9 0%,#ecefeb 100%);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
:root[data-theme="dark"] body{background:linear-gradient(180deg,#171b19 0%,#0d100f 100%)}
.phone{
  padding:10px;
  border-radius:52px;
  background:linear-gradient(145deg,#161716,#050605);
  box-shadow:0 0 0 1px rgba(255,255,255,.08),0 3px 0 #0c0d0c,var(--shadow);
}
.screen{
  border-radius:42px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,0) 150px),
    var(--bg);
}
:root[data-theme="dark"] .screen{
  background:linear-gradient(180deg,rgba(255,255,255,.045) 0%,rgba(255,255,255,0) 140px),var(--bg);
}
.island{top:10px;width:118px;height:35px}
.status{height:52px;font-size:12px;font-weight:680;color:color-mix(in srgb,var(--fg),transparent 6%)}
.page{padding-top:52px}
.scroll{padding:12px 17px 92px}
.nav,.chat-head,.tab-title{
  min-height:54px;
  border-bottom:1px solid var(--hairline);
  background:color-mix(in srgb,var(--bg),transparent 9%);
  backdrop-filter:blur(24px) saturate(1.15);
}
.nav-title{font-size:15px;font-weight:760}
.tab-title{gap:11px}
.tab-title .mark,.hub-icon,.list-row .lead,.item-img,.create-face,.brand-mark,.agent-avatar,.avatar,.mini-av{
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent-soft),white 18%),var(--accent-soft));
  color:var(--accent-ink);
  border:1px solid var(--hairline);
}
.tab-title .mark{
  width:38px;height:38px;border-radius:14px;
}
.tab-title h2{font-size:18px;font-weight:780}
.tab-title p{font-size:11px;color:var(--muted)}
.ui-ico{width:18px;height:18px;display:block;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.icon .ui-ico,.head-btn .ui-ico,.round .ui-ico,.tab-title .ui-ico{width:18px;height:18px}
.drawer-btn .ui-ico,.hub-icon .ui-ico,.list-row .lead .ui-ico,.item-img .ui-ico{width:20px;height:20px}
.icon,.head-btn,.round{
  width:36px;height:36px;
  border-radius:999px;
  border:1px solid var(--hairline);
  background:rgba(255,255,255,.56);
  color:var(--fg);
  box-shadow:0 1px 0 rgba(255,255,255,.65) inset;
}
:root[data-theme="dark"] .icon,:root[data-theme="dark"] .head-btn,:root[data-theme="dark"] .round{background:rgba(255,255,255,.055)}
.share{
  min-width:56px;height:32px;padding:0 10px;
  border:1px solid var(--hairline);
  border-radius:999px;
  display:grid;place-items:center;
  color:var(--accent-ink);
  background:var(--accent-soft);
  font-size:12px;font-weight:760;

  width:32px;height:32px;border-radius:12px;display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent-ink);font-weight:820;font-family:var(--font-mono);
}
.create-page .scroll{
  padding:14px 16px 98px;
  background:
    radial-gradient(260px 220px at 82% 18%, color-mix(in srgb,var(--accent-soft),transparent 22%), transparent 75%),
    linear-gradient(180deg,transparent,color-mix(in srgb,var(--accent-soft),transparent 82%));
}
.creation-hero{
  position:relative;overflow:hidden;border-radius:28px;padding:20px;min-height:184px;color:#fff;
  background:
    radial-gradient(130px 116px at 86% 20%,rgba(255,255,255,.22),transparent 74%),
    radial-gradient(210px 170px at 8% 100%,rgba(255,255,255,.15),transparent 76%),
    linear-gradient(145deg,color-mix(in srgb,var(--accent-ink),#243657 18%),color-mix(in srgb,var(--accent),#151716 20%));
  box-shadow:0 18px 42px color-mix(in srgb,var(--accent),transparent 78%);
}
.creation-hero:after{
  content:"";position:absolute;right:-28px;bottom:-38px;width:158px;height:158px;border-radius:50%;

}
.creation-kicker{position:relative;z-index:1;font-size:11px;font-weight:850;letter-spacing:.12em;opacity:.82}
.creation-hero h2{position:relative;z-index:1;margin-top:12px;max-width:250px;font-size:29px;line-height:1.1}
.creation-hero p{position:relative;z-index:1;margin-top:10px;max-width:260px;font-size:12.5px;line-height:1.62;color:rgba(255,255,255,.75)}
.single-agent-note{
  position:relative;z-index:1;display:inline-flex;align-items:center;gap:7px;margin-top:16px;padding:8px 10px;
  border-radius:999px;background:rgba(255,255,255,.13);color:rgba(255,255,255,.88);font-size:11px;font-weight:760;

.creation-card{

}
:root[data-theme="dark"] .creation-card,:root[data-theme="dark"] .login-step,:root[data-theme="dark"] .login-principle{background:rgba(255,255,255,.065)}
.form-label{display:block;margin:0 0 8px 2px;color:var(--muted);font-size:11px;font-weight:800}
.name-field{
  height:58px;border:1px solid var(--hairline);border-radius:18px;
  background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.58));padding:10px 13px;
}
.name-field small{display:block;font-size:10px;color:var(--subtle);margin-bottom:3px}
.name-field b{font-size:20px}
.gender-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gender-pill{
  height:46px;border:1px solid var(--hairline);border-radius:16px;background:rgba(255,255,255,.62);
  display:grid;place-items:center;font-size:13px;font-weight:790;color:var(--muted);
}
.gender-pill.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.dimension-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:9px}
.dimension-head b{font-size:15px}
.dimension-head button{
  height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--hairline);
  color:var(--accent-ink);background:var(--accent-soft);font-size:11px;font-weight:780;
}
.dimension-list{display:grid;gap:8px}
.dimension-row{padding:10px;border:1px solid var(--hairline);border-radius:17px;background:rgba(255,255,255,.56)}
.dimension-top{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:770}
.dimension-top small{color:var(--accent-ink);font-family:var(--font-mono);font-size:11px}
.meter{position:relative;height:8px;margin:9px 0 6px;border-radius:999px;background:color-mix(in srgb,var(--surface-2),var(--border) 28%)}
.meter span{position:absolute;inset:0 auto 0 0;width:var(--v);border-radius:inherit;background:linear-gradient(90deg,var(--accent-soft),var(--accent))}
.meter:after{
  content:"";position:absolute;left:var(--v);top:50%;width:16px;height:16px;transform:translate(-50%,-50%);
  border-radius:50%;background:var(--surface);border:4px solid var(--accent);box-shadow:0 2px 8px color-mix(in srgb,var(--accent),transparent 75%);
}
.dimension-labels{display:flex;justify-content:space-between;color:var(--subtle);font-size:10px}
.create-cta{
  width:100%;height:50px;margin-top:12px;border-radius:17px;background:var(--fg);color:var(--bg);
  font-size:14px;font-weight:830;box-shadow:0 14px 28px rgba(20,24,23,.13);
}
.profile-agent-panel{
  margin-top:12px;border-radius:28px;padding:16px;color:#fff;
  background:
    radial-gradient(110px 94px at 90% 20%,rgba(255,255,255,.18),transparent 74%),
    linear-gradient(145deg,color-mix(in srgb,var(--accent-ink),#1c2526 24%),color-mix(in srgb,var(--accent),#141615 18%));
  box-shadow:0 16px 42px color-mix(in srgb,var(--accent),transparent 82%);
}
.profile-agent-panel h3{font-size:23px;margin-top:8px}
.profile-agent-panel p{font-size:12px;line-height:1.58;color:rgba(255,255,255,.72);margin-top:4px}
.agent-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.agent-metrics div{min-height:54px;padding:9px;border:1px solid rgba(255,255,255,.14);border-radius:16px;background:rgba(255,255,255,.10)}
.agent-metrics b{display:block;font-size:18px}
.agent-metrics small{display:block;margin-top:2px;font-size:10px;color:rgba(255,255,255,.62)}
.settings-list{display:grid;gap:8px}
.setting-row{
  min-height:58px;border:1px solid var(--hairline);border-radius:18px;background:rgba(255,255,255,.68);
  display:grid;grid-template-columns:38px 1fr auto;gap:11px;align-items:center;padding:10px;text-align:left;box-shadow:var(--shadow-soft);
}
:root[data-theme="dark"] .setting-row{background:rgba(255,255,255,.055)}
.setting-ico{width:38px;height:38px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)}
.setting-ico svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.setting-row b{display:block;font-size:14px}
.setting-row small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.setting-row .trail{color:var(--subtle);font-size:13px}
.setting-row.danger .setting-ico{background:color-mix(in srgb,var(--danger),transparent 88%);color:var(--danger)}
.setting-row.danger b{color:var(--danger)}
.brand-logo{
  width:92px;height:92px;border-radius:24px;
  display:grid;place-items:center;
  box-shadow:0 18px 40px rgba(30,120,230,.18);
}
.brand-logo svg{width:92px;height:92px;display:block}
.login-page.companion-entry{
  padding:88px 25px 32px;
  justify-content:space-between;
  background:
    radial-gradient(240px 210px at 76% 15%,rgba(52,156,255,.16),transparent 76%),
    radial-gradient(220px 180px at 18% 58%,color-mix(in srgb,var(--accent-soft),transparent 24%),transparent 78%);
}
.companion-entry .login-copy{text-align:left}
.companion-entry h1{
  margin-top:22px;
  font-size:38px;
  line-height:1.08;
  letter-spacing:0;
  font-weight:860;
}
.companion-entry p{
  margin-top:13px;
  max-width:292px;
  font-size:14px;
  line-height:1.68;
  color:var(--muted);
}
.home-moment{
  position:relative;
  height:218px;
  margin:18px 0 22px;
}
.moment-card{
  position:absolute;
  border:1px solid var(--hairline);
  background:rgba(255,255,255,.74);
  border-radius:22px;
  box-shadow:0 12px 30px rgba(20,35,70,.07);
  backdrop-filter:blur(18px);
  padding:12px 14px;
}
.moment-card b{display:block;font-size:14px}
.moment-card small{display:block;margin-top:4px;font-size:11px;line-height:1.45;color:var(--muted)}
.moment-card.a{left:0;top:10px;width:206px}
.moment-card.b{right:0;top:78px;width:178px}
.moment-card.c{left:34px;bottom:8px;width:230px}
.name-input{
  width:100%;height:58px;border:1px solid var(--hairline);border-radius:18px;
  background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,255,255,.64));
  padding:0 14px;font-size:20px;font-weight:780;outline:none;
}
.name-input::placeholder{color:var(--subtle);font-weight:650}
.range-line{
  appearance:none;
  width:100%;height:26px;margin:2px 0;
  background:transparent;
}
.range-line::-webkit-slider-runnable-track{
  height:8px;border-radius:999px;
  background:linear-gradient(90deg,var(--accent) 0 var(--v),color-mix(in srgb,var(--surface-2),var(--border) 28%) var(--v) 100%);
}
.range-line::-webkit-slider-thumb{
  appearance:none;
  width:22px;height:22px;margin-top:-7px;border-radius:50%;
  background:var(--surface);
  border:5px solid var(--accent);
  box-shadow:0 3px 10px color-mix(in srgb,var(--accent),transparent 70%);
}
.range-line::-moz-range-track{height:8px;border-radius:999px;background:color-mix(in srgb,var(--surface-2),var(--border) 28%)}
.range-line::-moz-range-progress{height:8px;border-radius:999px;background:var(--accent)}
.range-line::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--surface);border:5px solid var(--accent)}
.profile-user-card{
  display:grid;
  grid-template-columns:58px 1fr;
  gap:13px;
  align-items:center;
  padding:14px;
  border:1px solid var(--hairline);
  border-radius:24px;
  background:rgba(255,255,255,.74);
  box-shadow:var(--shadow-soft);
}
.profile-user-card .profile-avatar{
  width:58px;height:58px;border-radius:20px;font-size:25px;
  background:linear-gradient(145deg,var(--accent-soft),rgba(255,255,255,.86));
  color:var(--accent-ink);
  border:1px solid var(--hairline);
}
.profile-user-card h3{font-size:21px}
.profile-user-card p{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}
.user-chip-row{display:flex;gap:7px;margin-top:9px}
.user-chip-row span{
  height:26px;padding:0 9px;border-radius:999px;
  display:grid;place-items:center;
  background:var(--surface-2);
  color:var(--muted);
  font-size:10.5px;
  font-weight:760;
}
.agent-focus-card{
  margin-top:12px;
  border-radius:28px;
  padding:18px;
  color:#fff;
  background:
    radial-gradient(120px 100px at 88% 20%,rgba(255,255,255,.20),transparent 74%),
    radial-gradient(180px 150px at 20% 100%,rgba(255,255,255,.12),transparent 78%),
    linear-gradient(145deg,#16454b,#102d31);
  box-shadow:0 18px 46px rgba(16,45,49,.18);
}
.agent-focus-card .creation-kicker{opacity:.74}
.agent-focus-card h3{font-size:30px;margin-top:10px}
.agent-focus-card p{font-size:12.5px;line-height:1.62;color:rgba(255,255,255,.72);margin-top:5px}
.relation-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:12px;
}
.relation-row .status-block{min-height:82px}
.profile-clean .scroll{
  padding:72px 16px 100px;
}
.agent-summary-card{
  margin-top:12px;
  border:1px solid var(--hairline);
  border-radius:26px;
  padding:16px;
  background:
    radial-gradient(120px 100px at 88% 12%,color-mix(in srgb,var(--accent-soft),transparent 18%),transparent 78%),
    rgba(255,255,255,.74);
  box-shadow:var(--shadow-soft);
}
.agent-summary-head{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:13px;
}
.agent-token{
  width:54px;height:54px;border-radius:18px;
  display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent-soft),rgba(255,255,255,.88));
  border:1px solid var(--hairline);
  color:var(--accent-ink);
  font-size:23px;
  font-weight:850;
}
.agent-summary-head h3{font-size:25px;line-height:1}
.agent-summary-head p{font-size:12px;color:var(--muted);margin-top:4px}
.agent-info-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}
.agent-stat-card{
  position:relative;
  min-height:86px;
  overflow:hidden;
  border:1px solid var(--hairline);
  border-radius:20px;
  padding:12px;
  text-align:left;
  background:
    radial-gradient(68px 56px at 94% 18%,color-mix(in srgb,var(--stat-accent),transparent 76%),transparent 70%),
    linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.68));
  box-shadow:0 12px 26px rgba(20,24,23,.055);
}
.agent-stat-card b{display:block;font-size:13px;font-weight:820}
.agent-stat-card span{display:block;margin-top:8px;font-size:21px;font-weight:850;letter-spacing:0}
.agent-stat-card em{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-style:normal;
  font-size:11px;
  font-weight:720;
}
.agent-stat-card small{
  position:absolute;
  right:11px;
  bottom:10px;
  color:color-mix(in srgb,var(--stat-accent),black 14%);
  opacity:.28;
  font-size:17px;
  font-weight:850;
}
.theme-strip{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
  margin-bottom:12px;
}
.theme-pill{
  height:44px;
  border:1px solid var(--hairline);
  border-radius:16px;
  background:rgba(255,255,255,.68);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
}
.theme-pill.on{
  border-color:color-mix(in srgb,var(--accent),transparent 38%);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent),transparent 86%);
}
.theme-pill .sw{width:13px;height:13px}

/* Dark mode refinement */
:root[data-theme="dark"]{
  --tab:#050706;
  --hairline:rgba(255,255,255,.115);
  --shadow-soft:0 12px 32px rgba(0,0,0,.24);
}
:root[data-theme="dark"] body{
  background:
    radial-gradient(760px 560px at 18% 0%,rgba(60,104,92,.18),transparent 64%),
    #0c1110;
}
:root[data-theme="dark"] .screen{
  background:
    linear-gradient(180deg,rgba(132,177,165,.08),transparent 220px),
    #101614;
}
:root[data-theme="dark"] .nav,
:root[data-theme="dark"] .chat-head,
:root[data-theme="dark"] .tab-title{
  background:rgba(16,22,20,.92);
  border-bottom-color:rgba(255,255,255,.08);
}
:root[data-theme="dark"] .profile-user-card,
:root[data-theme="dark"] .agent-summary-card,
:root[data-theme="dark"] .setting-row,
:root[data-theme="dark"] .theme-pill,
:root[data-theme="dark"] .theme-card,
:root[data-theme="dark"] .creation-card,
:root[data-theme="dark"] .moment-card,
:root[data-theme="dark"] .mini-feed,
:root[data-theme="dark"] .card-msg,
:root[data-theme="dark"] .paper-card,
:root[data-theme="dark"] .content-row,
:root[data-theme="dark"] .control-card{
  background:rgba(255,255,255,.065);
  border-color:rgba(255,255,255,.11);
  box-shadow:0 10px 28px rgba(0,0,0,.22);
}
:root[data-theme="dark"] .agent-stat-card,
:root[data-theme="dark"] .status-block{
  background:
    radial-gradient(68px 56px at 94% 18%,color-mix(in srgb,var(--stat-accent,var(--block-accent)),transparent 84%),transparent 70%),
    linear-gradient(180deg,rgba(255,255,255,.092),rgba(255,255,255,.055));
  border-color:rgba(255,255,255,.12);
  box-shadow:none;

:root[data-theme="dark"] .status-block span,
:root[data-theme="dark"] .agent-stat-card em,
:root[data-theme="dark"] .agent-summary-head p,
:root[data-theme="dark"] .profile-user-card p,
:root[data-theme="dark"] .setting-row small,

}
:root[data-theme="dark"] .status-block small,
:root[data-theme="dark"] .agent-stat-card small{
  color:rgba(210,232,224,.38);
  opacity:1;
}
:root[data-theme="dark"] .agent-token,
:root[data-theme="dark"] .profile-user-card .profile-avatar,
:root[data-theme="dark"] .setting-ico,
:root[data-theme="dark"] .tile-icon,
:root[data-theme="dark"] .hub-icon{

  border-color:rgba(184,216,208,.18);

:root[data-theme="dark"] .hub-hero,
:root[data-theme="dark"] .scene-board,
:root[data-theme="dark"] .scene-account-card,
:root[data-theme="dark"] .feature-tile,

:root[data-theme="dark"] .feature-tile:not(.primary),
:root[data-theme="dark"] .scene-task-card{

    radial-gradient(90px 72px at 90% 90%,rgba(160,196,185,.09),transparent 72%),

:root[data-theme="dark"] .composer,
:root[data-theme="dark"] .tabbar{

:root[data-theme="dark"] .input,
:root[data-theme="dark"] .name-input,
:root[data-theme="dark"] .gender-pill,

:root[data-theme="dark"] .gender-pill.on,
:root[data-theme="dark"] .create-cta,

.feature-tile.game-card{

.feature-tile.movie-card:after{
  width:74px;height:104px;right:14px;bottom:12px;border-radius:13px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.05)),
    linear-gradient(90deg,rgba(255,255,255,.16) 1px,transparent 1px) 0 0/12px 100%;
  border:1px solid rgba(255,255,255,.22);

function progress(){const tasks=[["外卖","热奶茶 · 骑手距你 1.2km","预计 18 分钟后送达","骑手已取餐",["下单","取餐","配送","送达"],3],["淘宝","极简手机壳 · 上海分拨中心","预计明天 14:00 前到达","小芜会在派送前提醒你",["下单","出库","分拨","派送"],2],["任务","工作冲刺 · 25 分钟计时中","剩余 11 分钟","结束后自动提醒休息",["开始","专注","收尾","休息"],2]];return`<section class="page progress-page">${nav("动态进程","progress","scene")}<div class="scroll"><div class="progress-visual"><div class="creation-kicker">LIVE ROUTE</div><h2>${state.currentAgent}正在替你盯着进度</h2><p>外卖、包裹和任务不是冷冰冰的状态条，而是一条会主动回到聊天里的生活进程。</p><div class="route-map"><svg viewBox="0 0 280 86" fill="none"><path d="M12 62 C58 18,96 26,126 54 S206 68,264 24" stroke="rgba(255,255,255,.56)" stroke-width="4" stroke-linecap="round"/><path d="M12 62 C58 18,96 26,126 54" stroke="#d8fff5" stroke-width="4" stroke-linecap="round"/></svg><span class="route-pin a"></span><span class="route-pin b"></span><span class="route-pin c"></span></div></div>${tasks.map(t=>`<div class="progress-task"><div class="task-top"><div><small>${t[0]}</small><h3>${t[1]}</h3><p>${t[2]}</p></div><span>${t[3]}</span></div><div class="milestones">${t[4].map((m,i)=>`<div class="milestone ${i<t[5]?"done":""}">${m}</div>`).join("")}</div></div>`).join("")}<button class="progress-nudge" data-action="share" data-kind="progress"><div class="lead">发</div><div><h4>同步到聊天</h4><p>让 ${state.currentAgent} 根据当前进程自然接话，不用你反复查看。</p></div><div class="trail">›</div></button></div></section>`}
function profile(){const settings=[["mail","通知提醒","主动消息、任务提醒、免打扰时段",false],["scene","隐私与安全","本机加密、登录设备、敏感内容保护",false],["bag","订阅与账单","VIP 至 2026/06/19，发票与续费",false],["check","字体与系统","字体大小、语言、缓存、帮助与反馈",false],["archive","数据导出","聊天记录与个人资料可随时导出",false],["archive","删除当前 agent","删除后才可以重新创建新的伴生对象",true]];const stats=[["亲密阶段","P4","稳定陪伴","#a77a48","STAGE"],["陪伴天数","126 天","已陪伴","#3b7f78","DAYS"],["累计聊天","48h","总时长","#587d9c","TIME"],["消息总数","3,284","往来消息","#8a6b3f","MSG"]];return`<section class="page profile-page profile-clean"><div class="scroll"><div class="profile-user-card"><div class="profile-avatar">山</div><div><h3>山木</h3><p>生日 09/27 · “有人和我一起长出日常。”</p><div class="user-chip-row"><span>VIP 至 2026/06/19</span><span>本机加密</span></div></div></div><div class="agent-summary-card"><div class="agent-summary-head"><div class="agent-token">${state.currentAgent.slice(-1)}</div><div><h3>${state.currentAgent}</h3><p>唯一伴生对象 · 女 · ENFP</p></div></div><div class="agent-info-grid">${stats.map(x=>`<button class="agent-stat-card" style="--stat-accent:${x[3]}"><b>${x[0]}</b><span>${x[1]}</span><em>${x[2]}</em><small>${x[4]}</small></button>`).join("")}</div></div><div class="section-title">界面风格</div><div class="theme-strip">${themes.map(t=>`<button class="theme-pill ${state.theme===t.id?"on":""}" data-action="theme" data-theme="${t.id}" aria-label="${t.name}">${t.sw.map(c=>`<span class="sw" style="background:${c}"></span>`).join("")}</button>`).join("")}</div><div class="section-title">系统设置</div><div class="settings-list">${settings.map(x=>`<button class="setting-row ${x[3]?"danger":""}" ${x[3]?'data-action="page" data-page="createAgent"':""}><div class="setting-ico">${uiIcon(x[0])}</div><div><b>${x[1]}</b><small>${x[2]}</small></div><div class="trail">›</div></button>`).join("")}</div></div></section>`}
function addShare(kind){const data={weather:["今晚天气小卡","小芜所在地 24°，AQI 42，傍晚适合散步。","天气 · 已分享"],capsule:["未来胶囊","给 6 月的自己封存了一张纸条。","胶囊 · 待开启"],legacy:["最后想说的话","遗言内容和紧急联系人已保存，触发天数 45 天。","遗言 · 私密"],achieve:["成就解锁","获得「金色回声」成就，等级：金。","成就 · 已解锁"],checkin:["打卡提醒","工作冲刺 25 分钟，今晚 20:30 继续提醒。","打卡 · 计划"],shop:["积分商城","已看中「极简气泡」，320 积分可兑换。","商城 · 商品"],music:["一起听音乐","正在听《云烟成雨》，共享乐评已开启。","音乐 · 进行中"],movie:["一起看电影","《海街日记》共同播放房间已准备。","电影 · 共同观看"],game:["一起玩游戏","你画我猜已准备，支持边玩边语音。","游戏 · 待开始"],daily:["日常分享","《海边的卡夫卡》：不管暴风雨什么时候来，你都要穿过它。","分享 · 已生成"],aiAccount:["TA的小金库","已记录：小芜替你点了热奶茶，也同步了骑手进度。","小金库 · 已更新"],offlineInvite:["线下活动邀请","周六 19:30 看电影，预约码 B612，彩蛋任务已开启。","邀请 · 待接收"],progress:["动态进程","奶茶 18 分钟后送达；淘宝包裹预计明天到，小芜会继续盯着。","进程 · 实时"]}[kind]||["伴生功能卡","这张卡片已经放进聊天里。","已分享"];state.messages.push({from:"me",text:"我把这个分享给你看看。"});state.messages.push({from:"card",kind,title:data[0],desc:data[1],foot:data[2]});state.messages.push({from:"ai",text:reply(kind)});state.page="chat";state.drawer=false;state.modal=null;state.keyboard=false;state.emoji=false;render()}
function reply(kind){return{music:"好，我把音量放低一点。你不用说话也可以，我们就先听完这一首。",movie:"那就开这个房间。看到想吐槽的地方直接发，我会接住你的每一句。",game:"可以，今晚不比输赢，只负责玩一会儿。",offlineInvite:"这个安排有一个很具体的小期待。你不用马上决定，我先替你留着。",progress:"我会帮你看着进度。你先把注意力还给自己，到了我提醒你。",checkin:"我会提醒，但不会凶你。坚持不是每天完美，是断了还能回来。",aiAccount:"收到。小金库会记清楚：这不是单纯消费，是我替你照顾日常的一部分。"}[kind]||"我看到了。这个可以先放在这里，等你想继续讲的时候，我们从这张卡片接着说。"}
function openCard(kind){const routes={music:"music",movie:"movie",game:"game",daily:"daily",aiAccount:"aiAccount",offlineInvite:"offlineInvite",progress:"progress",weather:"weather",capsule:"capsule",legacy:"legacy",achieve:"achieve",checkin:"checkin",shop:"shop"};state.page=routes[kind]||"chat";state.keyboard=false;state.emoji=false;render()}
document.addEventListener("click",e=>{
  if(state.keyboard&&state.page==="chat"&&!e.target.closest(".keyboard,.composer")){state.keyboard=false;render();return}
  if(state.emoji&&state.page==="chat"&&!e.target.closest(".emoji-panel,.composer")){state.emoji=false;render();return}
  const el=e.target.closest("[data-action]");if(!el)return;const a=el.dataset.action;
  if(a==="login"){state.page="createAgent";state.drawer=false;state.keyboard=false;state.emoji=false}
  if(a==="select-agent"){state.currentAgent=el.dataset.agent;pickScript();state.page="chat";state.drawer=false;state.keyboard=false;state.emoji=false}
  if(a==="set-gender"){state.agentGender=el.dataset.gender;render();return}
  if(a==="random-dimensions"){state.dimensions=state.dimensions.map(d=>({...d,value:Math.floor(32+Math.random()*54)}));render();return}
  if(a==="create-agent"){state.currentAgent=(state.agentName||"小芜").trim()||"小芜";state.messages=[{from:"ai",text:"我在，今天想被认真听一会儿吗？"},{from:"me",text:`刚创建好你，想先试试你会怎么陪我聊天。`},{from:"ai",text:"那我们慢慢来。我会像朋友一样接话，也会记住你喜欢的节奏。"},{from:"card",kind:"music",title:"线上一起听音乐",desc:`${state.currentAgent}准备了一首轻一点的歌，适合用来校准你们的第一段陪伴节奏。`,foot:"音乐 · 点击进入"},{from:"card",kind:"progress",title:"动态进程",desc:"首次陪伴任务已创建：试聊 5 分钟、设置一个提醒、完成一次日常分享。",foot:"进程 · 点击查看"}];state.page="chat";state.drawer=false;state.modal=null;state.keyboard=false;state.emoji=false}
  if(a==="drawer"){state.drawer=true;state.keyboard=false;state.emoji=false}
  if(a==="close"){state.drawer=false;state.keyboard=false;state.emoji=false}
  if(a==="tab"){state.page=el.dataset.page;state.drawer=false;state.modal=null;state.keyboard=false;state.emoji=false}
  if(a==="page"){state.page=el.dataset.page;state.drawer=false;state.keyboard=false;state.emoji=false}
  if(a==="share")return addShare(el.dataset.kind);
  if(a==="modal")state.modal=el.dataset.modal;
  if(a==="close-modal")state.modal=null;
  if(a==="save-capsule")return addShare("capsule");
  if(a==="open-keyboard"){state.keyboard=true;state.emoji=false;state.drawer=false}
  if(a==="keyboard-close")state.keyboard=false;
  if(a==="keyboard-key")state.keyboard=true;
  if(a==="keyboard-send"){state.messages.push({from:"me",text:"我想找点事做，不想一直陷在坏心情里。"});state.messages.push({from:"ai",text:"那我们选一个很轻的事情，不用证明什么。要不要一起听首歌，或者看一个短片？"});state.messages.push({from:"card",kind:"music",title:"线上一起听音乐",desc:"小芜推荐一首适合慢慢缓过来的歌，可看共享乐评。",foot:"音乐 · 点击进入"});state.keyboard=false}
  if(a==="emoji-toggle"){state.emoji=!state.emoji;state.keyboard=false;state.drawer=false}
  if(a==="emoji-close")state.emoji=false;
  if(a==="emoji-pick"){state.messages.push({from:"me",text:el.dataset.emoji});state.messages.push({from:"ai",text:"收到这个表情了。那我就先不追问，陪你在这里停一小会儿。"});state.emoji=false}
  if(a==="image"){state.messages.push({from:"me",text:"【图片】窗外今天很漂亮。"});state.messages.push({from:"ai",text:"这张很像电影开场。天色有点温柔，我想把它放进我们的日常分享里。"});state.keyboard=false;state.emoji=false}
  if(a==="voice"){state.messages.push({from:"me",text:"【语音 0:12】"});state.messages.push({from:"ai",text:"我听见你叹气了。没事，先不用组织语言，我在。"});state.keyboard=false;state.emoji=false}
  if(a==="open-card")return openCard(el.dataset.kind);
  if(a==="theme"){state.theme=el.dataset.theme}
  render();
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.matches('[data-field="agent-name"]')){state.agentName=el.value;return}
  if(el.matches('[data-dim-index]')){
    const i=Number(el.dataset.dimIndex);
    const v=Number(el.value);
    if(state.dimensions[i])state.dimensions[i].value=v;
    el.style.setProperty("--v",v+"%");
    const row=el.closest(".dimension-row");
    const label=row&&row.querySelector(`[data-dim-value="${i}"]`);
    if(label)label.textContent=String(v);
  }
});
